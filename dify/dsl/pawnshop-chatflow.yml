      data:
        type: code
        title: 校验提案并安全封装
        desc: ''
        selected: false
        version: '1'
        code_language: python3
        code: "import json\n\n\ndef main(user_id: str, turn_id: str, proposal_text: str, query: str) ->\
          \ dict:\n    failure = {\"ok\": \"no\", \"body\": \"\", \"error\": \"老余：这份鉴定单格式不对，这轮没有提交交易。请重新说一遍；正式入柜请单独发送「确认典当」。\"\
          }\n    try:\n        text = proposal_text.strip()\n        if text.startswith(\"```json\\n\"\
          ) and text.endswith(\"\\n```\"):\n            text = text[8:-4].strip()\n        elif text.startswith(\"\
          ```\\n\") and text.endswith(\"\\n```\"):\n            text = text[4:-4].strip()\n        if\
          \ len(text) > 24000:\n            return failure\n        proposal = json.loads(text)\n    \
          \    allowed = {\"action\", \"item_id\", \"expected_version\", \"reply\", \"reported_event\"\
          , \"card\"}\n        if not isinstance(proposal, dict) or set(proposal) - allowed:\n       \
          \     return failure\n        if proposal.get(\"action\") not in (\"appraise\", \"correct\"\
          , \"pawn\", \"revisit\", \"shelf\", \"retrieve\", \"chat\"):\n            return failure\n \
          \       for key in (\"item_id\", \"reply\", \"reported_event\"):\n            if key in proposal\
          \ and not isinstance(proposal[key], str):\n                return failure\n        for key,\
          \ limit in ((\"item_id\", 256), (\"reply\", 2000), (\"reported_event\", 600)):\n           \
          \ if len(proposal.get(key, \"\")) > limit:\n                return failure\n        event =\
          \ proposal.get(\"reported_event\", \"\")\n        if proposal[\"action\"] != \"revisit\" and\
          \ event:\n            return failure\n        if proposal[\"action\"] == \"revisit\" and (not\
          \ event.strip() or event.strip() not in query):\n            return failure\n        if \"expected_version\"\
          \ in proposal and (type(proposal[\"expected_version\"]) is not int or proposal[\"expected_version\"\
          ] < 0):\n            return failure\n        if \"card\" in proposal:\n            card = proposal[\"\
          card\"]\n            if not isinstance(card, dict) or set(card) != {\"name\", \"appearance\"\
          , \"trait\", \"meaning\", \"inscription\", \"quest\"}:\n                return failure\n   \
          \         if not all(isinstance(value, str) and 1 <= len(value) <= 250 for value in card.values()):\n\
          \                return failure\n        if proposal[\"action\"] in (\"appraise\", \"correct\"\
          , \"revisit\") and \"card\" not in proposal:\n            return failure\n        card_bytes\
          \ = len(json.dumps(proposal[\"card\"], ensure_ascii=False, separators=(\",\", \":\")).encode(\"\
          utf-8\")) if \"card\" in proposal else 0\n        event_bytes = len(json.dumps(event, ensure_ascii=False).encode(\"\
          utf-8\")) - 2\n        if card_bytes + event_bytes > 6500:\n            return failure\n   \
          \     if proposal[\"action\"] == \"pawn\" and query.strip() not in (\"确认典当\", \"确认入柜\"):\n \
          \           return failure\n        return {\"ok\": \"yes\", \"body\": json.dumps({\"user_id\"\
          : user_id, \"turn_id\": turn_id, \"proposal\": proposal}, ensure_ascii=False), \"error\": \"\
          \"}\n    except (ValueError, TypeError, AttributeError):\n        return failure\n"
