      data:
        type: code
        title: 校验真实交易回执
        desc: ''
        selected: false
        version: '1'
        code_language: python3
        code: "import json\n\n\ndef main(status_code: int, body: str) -> dict:\n    failure = {\"ok\"\
          : \"no\", \"display\": \"\", \"error\": \"老余：没有拿到有效交易回执，不能说已经入柜或取回。交易结果待核实，请先查看货架再决定下一步。\"}\n\
          \    try:\n        if type(status_code) is not int or not 200 <= status_code < 300:\n      \
          \      return failure\n        data = json.loads(body)\n        if not isinstance(data, dict)\
          \ or data.get(\"ok\") is not True:\n            return failure\n        required = {\"action\"\
          , \"reply\", \"display\", \"item_id\", \"version\", \"memory_status\", \"memory_refs\", \"replayed\"\
          }\n        if not required <= set(data):\n            return failure\n        if data[\"action\"\
          ] not in (\"appraise\", \"correct\", \"pawn\", \"revisit\", \"shelf\", \"retrieve\", \"chat\"\
          ):\n            return failure\n        if not all(isinstance(data[key], str) for key in (\"\
          reply\", \"display\", \"item_id\", \"memory_status\")) or not data[\"display\"].strip():\n \
          \           return failure\n        if type(data[\"version\"]) is not int or data[\"version\"\
          ] < 0:\n            return failure\n        if not isinstance(data[\"memory_refs\"], list) or\
          \ type(data[\"replayed\"]) is not bool:\n            return failure\n        return {\"ok\"\
          : \"yes\", \"display\": data[\"display\"], \"error\": \"\"}\n    except (ValueError, TypeError,\
          \ KeyError):\n        return failure\n"
