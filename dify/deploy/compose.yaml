name: pawnshop-game
services:
  powercontext:
    image: pawnshop-powercontext:31ecdd61
    build:
      context: ${POWERCONTEXT_SOURCE:?Run bootstrap.py first}
      dockerfile: docker/Dockerfile
      args:
        POWERCONTEXT_VERSION: ${POWERCONTEXT_VERSION:-1.4.0}
    environment:
      POWERCONTEXT_HOME: /data
      POWERCONTEXT_SERVER_HTTP_HOST: 0.0.0.0
      POWERCONTEXT_SERVER_HTTP_PORT: '8000'
      POWERCONTEXT_SERVER_ACCESS_MODE: enforced
      POWERCONTEXT_SERVER_AUTH_TOKEN: ${POWERCONTEXT_TOKEN:?Set POWERCONTEXT_TOKEN}
      POWERCONTEXT_SERVER_DASHBOARD_ENABLED: 'true'
    ports:
      - 127.0.0.1:${POWERCONTEXT_PORT:-18082}:8000
    volumes:
      - ${PAWNSHOP_DATA:?Set PAWNSHOP_DATA}/powercontext:/data
    networks:
      - shared
    restart: unless-stopped
  pawnshop:
    image: pawnshop-backend:0.1.0
    build:
      context: ../backend
    environment:
      PAWNSHOP_API_KEY: ${PAWNSHOP_API_KEY:?Set PAWNSHOP_API_KEY}
      PAWNSHOP_DB_PATH: /data/pawnshop.sqlite3
      POWERCONTEXT_URL: http://powercontext:8000
      POWERCONTEXT_TOKEN: ${POWERCONTEXT_TOKEN:?Set POWERCONTEXT_TOKEN}
    ports:
      - 127.0.0.1:${PAWNSHOP_PORT:-18081}:8080
    volumes:
      - ${PAWNSHOP_DATA:?Set PAWNSHOP_DATA}/pawnshop:/data
    depends_on:
      powercontext:
        condition: service_healthy
    networks:
      - shared
    restart: unless-stopped
networks:
  shared:
    external: true
    name: pawnshop-shared
