name: nullpath

x-app-env: &app-env
  SEEKDB_HOST: seekdb
  SEEKDB_PORT: 2881
  SEEKDB_USER: root
  SEEKDB_PASSWORD: ${SEEKDB_PASSWORD:-}
  SEEKDB_DATABASE: nullpath
  POWERCONTEXT_URL: http://powercontext:8000
  POWERCONTEXT_TOKEN: ${POWERCONTEXT_TOKEN:-}
  POWERCONTEXT_SCOPE_ID: ${POWERCONTEXT_SCOPE_ID:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}

x-validation-env: &validation-env
  <<: *app-env
  SEEKDB_DATABASE: nullpath_validation

services:
  seekdb:
    image: oceanbase/seekdb:latest
    ports:
      - "127.0.0.1:2881:2881"
      - "127.0.0.1:2886:2886"
    volumes:
      - seekdb-data:/var/lib/oceanbase
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 2881 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  powercontext:
    build:
      context: https://github.com/oceanbase/powercontext.git#powercontext-v1.4.1
      dockerfile: docker/Dockerfile
      args:
        POWERCONTEXT_VERSION: 1.4.1
    environment:
      POWERCONTEXT_HOME: /data
      POWERCONTEXT_SERVER_HTTP_HOST: 0.0.0.0
      POWERCONTEXT_SERVER_HTTP_PORT: 8000
      POWERCONTEXT_SERVER_ACCESS_MODE: disabled
      POWERCONTEXT_SERVER_ALLOW_UNAUTHENTICATED_NON_LOOPBACK: "true"
      POWERCONTEXT_SERVER_DASHBOARD_ENABLED: "true"
      POWERCONTEXT_SERVER_DATABASE_KIND: sqlite
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - powercontext-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  bootstrap:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment: *app-env
    command: python -m nullpath.seed /data/archive.json
    volumes:
      - ../examples:/data:ro
    depends_on:
      seekdb:
        condition: service_healthy
      powercontext:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      <<: *app-env
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    command: uvicorn nullpath.api:app --host 0.0.0.0 --port 8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: ../web
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
    restart: unless-stopped

  validation-bootstrap:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment: *validation-env
    command: python -m nullpath.seed /data/archive.json
    volumes:
      - ../examples:/data:ro
    depends_on:
      seekdb:
        condition: service_healthy
      powercontext:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    profiles: ["validation"]
    restart: "no"

  validation-api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment: *validation-env
    command: uvicorn nullpath.api:app --host 0.0.0.0 --port 8080
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      validation-bootstrap:
        condition: service_completed_successfully
    profiles: ["validation"]
    restart: unless-stopped

volumes:
  seekdb-data:
  powercontext-data:
